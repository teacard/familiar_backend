name: CI/CD

# ────────────────────────────────────────────
# 全域環境變數：PHP 版本統一在此維護
# ────────────────────────────────────────────
env:
  PHP_VERSION: "8.5"

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  # ────────────────────────────────────────────
  # Job 1：CI（語法驗證、程式碼風格、測試）
  # PR 與 push 都會執行
  # ────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_sqlite, pdo_pgsql, pgsql, mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # 語法驗證：逐一檢查所有 PHP 檔案，任何語法錯誤都會讓步驟失敗
      - name: PHP syntax check
        run: find app bootstrap config database routes -name "*.php" -print0 | xargs -0 -n1 php -l

      # 程式碼風格驗證：只檢查不修改，不符合規則則失敗
      - name: Code style (PHP CS Fixer)
        run: ./vendor/bin/php-cs-fixer check --show-progress=none

      # 測試：phpunit.xml 已設定用 SQLite in-memory，無需真實 DB
      - name: Run tests
        run: php artisan test

      - name: Generate Swagger docs
        run: php artisan l5-swagger:generate --all

  # ────────────────────────────────────────────
  # Job 2：觸發 game-docker repo 建置 image 並部署
  # Build 已移至 docker repo 統一管理 Dockerfile
  # 必須 CI job 通過才會觸發
  # ────────────────────────────────────────────
  deploy:
    name: Trigger Build & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger game-docker build-backend workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/teacard/game-docker/actions/workflows/build-backend.yml/dispatches \
            -d '{"ref":"develop"}'
